name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      APP_DIR: /var/www/tmk-limited.com
      NEXT_PUBLIC_SITE_URL: https://tmk-limited.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload build
        run: |
          SSH="ssh -i ~/.ssh/deploy_key"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          rsync -az --delete --exclude cache -e "$SSH" .next/ "$TARGET:$APP_DIR/.next.incoming/"
          rsync -az --delete -e "$SSH" public/ "$TARGET:$APP_DIR/public/"
          rsync -az -e "$SSH" package.json package-lock.json next.config.ts "$TARGET:$APP_DIR/"

      - name: Switch version and restart
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "APP_DIR=$APP_DIR bash -s" <<'REMOTE'
          set -e
          cd "$APP_DIR"

          # Зависимости ставим только если изменился package-lock.json
          HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ "$(cat .deps-hash 2>/dev/null)" != "$HASH" ]; then
            npm ci --no-audit --no-fund
            echo "$HASH" > .deps-hash
          fi

          # Подмена сборки с возможностью отката
          rm -rf .next.prev
          [ -d .next ] && mv .next .next.prev
          mv .next.incoming .next
          [ -d .next.prev/cache ] && mv .next.prev/cache .next/cache || true

          pm2 restart tmk-limited --update-env > /dev/null

          ok=0
          for i in $(seq 1 20); do
            sleep 2
            if curl -fsS -m 5 http://127.0.0.1:3005/api/ready > /dev/null; then ok=1; break; fi
          done

          if [ "$ok" = 1 ]; then
            rm -rf .next.prev
            echo "Деплой выполнен, сайт отвечает"
          else
            echo "Сайт не ответил после деплоя — откатываю на прежнюю версию"
            rm -rf .next
            mv .next.prev .next
            pm2 restart tmk-limited > /dev/null
            exit 1
          fi
          REMOTE
